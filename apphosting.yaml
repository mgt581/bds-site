# Firebase App Hosting configuration for the Next.js audit platform.
#
# Secrets are set with `firebase apphosting:secrets:set` and kept out of git.
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: DATABASE_URL
    secret: bdsDatabaseUrl
    availability:
      - BUILD
      - RUNTIME
  - variable: DIRECT_URL
    secret: bdsDirectUrl
    availability:
      - BUILD
      - RUNTIME
  - variable: ADMIN_PASSWORD
    secret: bdsAdminPassword
    availability:
      - RUNTIME
  - variable: NEXTAUTH_SECRET
    secret: bdsNextAuthSecret
    availability:
      - RUNTIME
  - variable: NEXTAUTH_URL
    value: https://bds-site--bdssite-5fac1.europe-west4.hosted.app
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_APP_URL
    value: https://bds-site--bdssite-5fac1.europe-west4.hosted.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FRONTEND_URL
    value: https://bryantdigitalsolutions.com
    availability:
      - BUILD
      - RUNTIME
  - variable: RESEND_FROM_EMAIL
    value: "Bryant Digital Solutions <info@bryantdigitalsolutions.com>"
    availability:
      - RUNTIME
  - variable: ADMIN_EMAIL
    value: ajbryantsleads@gmail.com
    availability:
      - RUNTIME
  - variable: RESEND_API_KEY
    secret: bdsResendApiKey
    availability:
      - RUNTIME
  - variable: OPENAI_API_KEY
    secret: bdsOpenAiApiKey
    availability:
      - RUNTIME
  - variable: PAGESPEED_API_KEY
    secret: bdsPagespeedApiKey
    availability:
      - RUNTIME
  - variable: GOOGLE_REVIEWS_URL
    value: https://share.google/CXVLfLhnIW2oIhY9i
    availability:
      - RUNTIME
  - variable: GOOGLE_WRITE_REVIEW_URL
    value: "https://www.google.com/search?q=Bryant+Digital+Solutions&kgmid=/g/11n9c6xgb0#lrd=0x4ef644c2eb5923ad:0x80ecb762e6c3ad84,3,,,,"
    availability:
      - RUNTIME
  - variable: ALLOWED_ORIGINS
    value: https://bryantdigitalsolutions.com,https://www.bryantdigitalsolutions.com,https://mgt581.github.io
    availability:
      - RUNTIME
  - variable: RELEASE_ID
    value: 2026-08-02-audit-flow-v3
    availability:
      - RUNTIME
